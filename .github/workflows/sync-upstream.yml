name: Sync upstream and build
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Build the IPA even if upstream has nothing new'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge willfaust/Madeira main
        id: merge
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/willfaust/Madeira.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git merge --no-edit FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Build the IPA with the VC++ runtime
        if: steps.merge.outputs.new == 'true' || inputs.build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ios.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f vcruntime=true
