name: Build Madeira IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_i386:
        description: 'Build the optional 32-bit (i386/WoW64) PE set'
        type: boolean
        default: true
      vcruntime:
        description: 'Bundle Microsoft VC++ runtime DLLs (downloaded from Microsoft)'
        type: boolean
        default: true
      configuration:
        description: 'Xcode configuration (Debug is the one that runs games, see docs/BUILDING.md)'
        type: choice
        options: [ Debug, Release ]
        default: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MINGW_NAME: llvm-mingw-20260421-ucrt-macos-universal
  MINGW_SHA256: bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7
  LLVM_VERSION: 15.0.7

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          if [ -d "$X/Contents/Developer" ]; then
            sudo xcode-select -s "$X/Contents/Developer"
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          else
            developer_dir="$(xcode-select -p 2>/dev/null || true)"
            [ -d "$developer_dir" ] || { echo "No Xcode installation found"; exit 1; }
            sudo xcode-select -s "$developer_dir"
            echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          sysctl -n hw.ncpu

      - name: Install host tools via Homebrew
        run: |
          brew install cmake ninja ccache meson bison flex llvm sevenzip cabextract msitools gnutls pkgconf autoconf automake libtool
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix sevenzip)/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages packaging || pip3 install --break-system-packages packaging

      - name: Configure LLVM environment
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$LLVM_PREFIX/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$LLVM_PREFIX" >> "$GITHUB_ENV"
          "$LLVM_PREFIX/bin/llvm-config" --version || true

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain download failed (may already be installed)"

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('scripts/build-ipa.sh') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Cache llvm-mingw
        id: mingw-cache
        uses: actions/cache@v4
        with:
          path: toolchains/${{ env.MINGW_NAME }}
          key: ${{ env.MINGW_NAME }}

      - name: Fetch llvm-mingw
        if: steps.mingw-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/${MINGW_NAME}.tar.xz"
          echo "${MINGW_SHA256}  /tmp/llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      - name: Cache LLVM iOS static libraries
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ runner.os }}-llvm-ios-15.0.7-v2

      - name: Cache FEX build
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: ${{ runner.os }}-fex-ios-cxx20-v8-${{ hashFiles('FEX/**', 'scripts/build/build-fex-ios.sh', 'scripts/patch_fex_atomic_ref.sh') }}
          restore-keys: |
            ${{ runner.os }}-fex-ios-cxx20-v8-

      - name: Clean FEX build tree
        run: rm -rf FEX/build-ios

      - name: Cache FFmpeg iOS build
        uses: actions/cache@v4
        with:
          path: |
            toolchains/ffmpeg-ios
            build/ffmpeg/obj
          key: ${{ runner.os }}-ffmpeg-ios-v1-${{ hashFiles('build/ffmpeg/build.sh', 'build/ffmpeg/src/SHA256SUMS') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-ios-v1-

      - name: Cache FreeType iOS build
        uses: actions/cache@v4
        with:
          path: |
            research/freetype
            build/freetype-ios/build
          key: ${{ runner.os }}-freetype-ios-v1-${{ hashFiles('scripts/build/build-freetype-ios.sh', 'build/freetype-ios/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-freetype-ios-v1-

      - name: Cache Wine host build
        uses: actions/cache@v4
        with:
          path: |
            wine/build-macos
            wine/build-arm64ec
          key: ${{ runner.os }}-wine-host-v5-${{ hashFiles('wine/**', 'scripts/build-ipa.sh', 'scripts/build/build-wine.sh') }}
          restore-keys: |
            ${{ runner.os }}-wine-host-v5-

      - name: Clean Wine build trees
        run: |
          rm -rf wine/build-macos wine/build-arm64ec wine/build-i386 build/wineserver/obj

      - name: Clean DXMT iOS build tree and VC runtime cache
        run: |
          rm -rf build/dxmt-ios/obj app/Madeira/libdxmt_combined.a
          rm -f toolchains/downloads/vc_redist*
          rm -rf toolchains/downloads/vc_redist* app/Madeira/x86_64-vcruntime

      - name: Configure Apple compiler environment
        run: |
          developer_dir="${DEVELOPER_DIR:-$(xcode-select -p)}"
          test -d "$developer_dir" || { echo "Selected Xcode is unavailable: $developer_dir"; exit 1; }
          sudo xcode-select -s "$developer_dir"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --find clang)"
          export CXX="$(xcrun --find clang++)"
          export OBJC="$(xcrun --find clang)"
          export OBJCXX="$(xcrun --find clang++)"
          {
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "OBJC=$OBJC"
            echo "OBJCXX=$OBJCXX"
          } >> "$GITHUB_ENV"
          "$CC" --version
          xcrun --sdk macosx --show-sdk-path

      - name: Fix script permissions
        run: |
          find scripts build -type f -name '*.sh' -exec chmod +x {} +

      - name: Resolve the 32-bit (i386) build flag
        id: i386
        run: |
          flag=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_i386 }}" = "false" ]; then
            flag=0
          fi
          echo "value=$flag" >> "$GITHUB_OUTPUT"
          echo "MADEIRA_BUILD_I386=$flag" >> "$GITHUB_ENV"
          echo "32-bit PE set: MADEIRA_BUILD_I386=$flag"

      - name: GnuTLS / Nettle / GMP (headers for ntdll-unix)
        run: build/gnutls-ios/build.sh

      - name: FFmpeg (LGPL, winegstreamer unix side)
        run: build/ffmpeg/build.sh

      - name: FEXCore for iOS
        run: |
          python3 - <<'PY'
          p = 'FEX/FEXCore/Source/Interface/Core/Core.cpp'
          s = open(p).read()
          start = s.find('  /* iOS-Madeira ml316: report ExitToX64 FFS bypasses')
          end = s.find('  /* iOS-Madeira: refuse to compile obviously-invalid guest RIPs.')
          if start != -1 and end != -1 and '#ifdef FEX_IOS_HOST\n  /* iOS-Madeira ml316' not in s:
              s = s[:start] + '#ifdef FEX_IOS_HOST\n' + s[start:end] + '#endif\n' + s[end:]
              open(p, 'w').write(s)
              print('guarded the FEX_IOS_HOST-only reporters in Core.cpp')
          p = 'FEX/FEXCore/Source/Utils/ArchHelpers/Arm64.cpp'
          s = open(p).read()
          start = s.find('  MEMORY_BASIC_INFORMATION mbi {};')
          end = s.find('mbi.Protect, type, mbi.State);', start)
          if start != -1 and end != -1 and '#ifdef _WIN32\n  MEMORY_BASIC_INFORMATION' not in s:
              end += len('mbi.Protect, type, mbi.State);\n')
              s = s[:start] + '#ifdef _WIN32\n' + s[start:end] + '#endif\n' + s[end:]
              open(p, 'w').write(s)
              print('guarded the Win32-only [caspal128] reporter in Arm64.cpp')
          p = 'FEX/FEXCore/Source/Interface/Core/Core.cpp'
          s = open(p).read()
          start = s.find('      {\n        rpm_cas_snapshot Snap;')
          tail = 'Snap.fail_changed, Snap.fail_unchanged, Snap.fail_invalid);\n        }\n      }\n'
          end = s.find(tail, start)
          if start != -1 and end != -1 and '#ifdef FEX_IOS_HOST\n      {\n        rpm_cas_snapshot Snap;' not in s:
              end += len(tail)
              s = s[:start] + '#ifdef FEX_IOS_HOST\n' + s[start:end] + '#endif\n' + s[end:]
              open(p, 'w').write(s)
              print('guarded the rpmalloc-only [rpm-cas] drain in Core.cpp')
          PY
          build/fex-ios/build.sh || { cmake --build FEX/build-ios --target FEXCore FEXCore_Base JemallocLibs -- -k 2>&1 | grep -E "error:|Error " | head -80; exit 1; }

      - name: Configure Wine host tree (wine/build-macos) and generate headers
        run: |
          set -eux
          export PATH="$PWD/toolchains/${MINGW_NAME}/bin:$PATH"
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --without-vulkan --without-freetype \
            --without-gstreamer --without-sdl --without-cups --without-krb5 --without-sane \
            --without-usb --without-pcap --without-v4l2 --without-opencl --disable-tests \
            --enable-winegstreamer
          grep -E "SONAME_LIBGNUTLS|HAVE_GNUTLS_CIPHER_INIT" include/config.h || echo "::warning::GnuTLS not detected by Wine configure; bcrypt/secur32 will be missing"
          make -j"$(sysctl -n hw.ncpu)" include/all tools/all

      - name: FreeType for iOS (dwrite + win32u fonts)
        run: |
          [ -d research/freetype ] || git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh

      - name: Wine ntdll unix side
        run: |
          if ! grep -q ri_page_wait_time_mach "$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/sys/resource.h"; then
            echo "::warning::SDK has no ri_page_wait_time_mach; reporting 0 for it"
            sed -i '' 's/ru\.ri_page_wait_time_mach - pru\.ri_page_wait_time_mach/0/' build/ntdll-unix/server_ios.c
          fi
          build/ntdll-unix/build.sh

      - name: Wine win32u unix side
        run: build/win32u-unix/build.sh

      - name: Wine server
        run: |
          set -eu
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          B=build/wineserver; W=wine; OBJ=$B/obj/base
          mkdir -p "$OBJ"
          REPLACED="async class event fd handle inproc_sync mach main mapping object process queue region request semaphore sock thread unicode user window winstation"
          for src in $W/server/*.c; do
            n=$(basename "$src" .c)
            case " $REPLACED " in *" $n "*) continue ;; esac
            echo "  base: $n"
            xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2 \
              -I$W/include -I$W/include/wine -I$W/build-macos/include -I$B -I$W/server \
              -Ibuild/ntdll-unix/shims -Ibuild/madsync -DHAVE_LINUX_NTSYNC_H=1 \
              -include $B/config_ios.h -include stdarg.h -include$B/unicode_fix.h \
              -include $B/wineserver_ios_kill.h \
              -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\" \
              -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main \
              -Wno-implicit-function-declaration -Wno-int-conversion \
              -c "$src" -o "$OBJ/$n.o" 2>"$B/obj/err-base-$n.txt" || { cat "$B/obj/err-base-$n.txt"; FAILED="${FAILED:-}$n"; }
          done
          [ -z "${FAILED:-}" ] || { echo "::error::base server objects failed:$FAILED"; exit 1; }
          xcrun -sdk iphoneos ar rcs app/Madeira/libwineserver.a "$OBJ"/*.o
          rm -rf "$OBJ"
          build/wineserver/build.sh

      - name: Cache LLVM for iOS
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-${{ env.LLVM_VERSION }}-v1

      - name: Build LLVM ${{ env.LLVM_VERSION }} for iOS
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p toolchains
          git clone --depth 1 --branch "llvmorg-${LLVM_VERSION}" https://github.com/llvm/llvm-project.git toolchains/llvm-project
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake
          CXXFIX="-include cstdint"
          cmake -G Ninja -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD= -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF -DCMAKE_CXX_FLAGS="$CXXFIX"
          ninja -C toolchains/llvm-host-build llvm-tblgen
          cmake -G Ninja -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host -DLLVM_TARGETS_TO_BUILD= -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_BUILD_TOOLS=OFF -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen" \
            -DCMAKE_CXX_FLAGS="$CXXFIX"
          ninja -C toolchains/llvm-ios-build
          ls toolchains/llvm-ios-build/lib/*.a | wc -l
          rm -rf toolchains/llvm-host-build

      - name: Save LLVM cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-${{ env.LLVM_VERSION }}-v1

      - name: DXMT unix side + combined archive
        run: |
          set -eu
          mkdir -p build/dxmt-ios/shader-headers
          for sh in air_msad air_samplepos air_tessellation; do
            (cd build/dxmt-ios/shader-headers \
             && xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 \
                  -o $sh.air -c ../../../research/dxmt/src/airconv/shaders/$sh.metal \
             && xxd -n $sh -i $sh.air $sh.h)
          done
          build/dxmt-ios/build.sh
          libtool -static -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/libdxmt_unix.a toolchains/llvm-ios-build/lib/libLLVM*.a 2>&1 | grep -v "same member name" || true
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a
          ls -lh app/Madeira/*.a

      - name: Madeira Dock (x86-64 PE)
        run: build/madeira-dock/build.sh || echo "::warning::Madeira Dock build failed; the Dock stays hidden"

      - name: Bundle inputs (licences, VC++ runtime)
        run: |
          set -eu
          build/stage-licenses.sh
          mkdir -p app/Madeira/x86_64-vcruntime app/Madeira/i386-windows
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.vcruntime }}" = "true" ]; then
            curl -fsSL -o /tmp/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
            python3 .github/scripts/fetch_vcruntime.py /tmp/vc_redist.x64.exe app/Madeira/x86_64-vcruntime \
              || echo "::error::VC++ runtime incomplete; this IPA ships without it"
          fi

      - name: Run build-ipa.sh
        run: |
          ./scripts/build-ipa.sh

      - name: Verify the 32-bit PE set was bundled
        if: steps.i386.outputs.value == '1'
        run: |
          n=$(find app/Madeira/i386-windows -name '*.dll' 2>/dev/null | wc -l | tr -d ' ')
          echo "i386 PE images collected: $n"
          if [ "$n" -lt 50 ]; then
            echo "::error::MADEIRA_BUILD_I386=1 but only $n i386 PE images exist — the WoW64 set was not produced."
            exit 1
          fi
          test -f app/Madeira/i386-windows/ntdll.dll || {
            echo "::error::i386 set has no ntdll.dll — WoW64 cannot initialise."
            exit 1
          }
          du -sh app/Madeira/i386-windows

      - name: Build app (iphoneos, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration "${{ inputs.configuration || 'Debug' }}" \
            -sdk iphoneos \
            SYMROOT="$PWD/app/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" | tail -n 300

      - name: Package IPA
        run: |
          set -eu
          APP="app/build/${{ inputs.configuration || 'Debug' }}-iphoneos/Madeira.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          codesign --force --sign - --entitlements app/Madeira/Madeira.entitlements Payload/Madeira.app
          mkdir -p dist
          zip -qry dist/Madeira.ipa Payload
          ls -lh dist/Madeira.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: dist/Madeira.ipa
          if-no-files-found: error

      - name: Publish Release for SideStore / LiveContainer Auto-Update
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Madeira Latest"
          body: |
            Automated latest build for Madeira.
            Add this repo source to SideStore or LiveContainer to receive automatic updates:
            `https://raw.githubusercontent.com/SaimSuhailQu/Madeira/main/apps.json`
          files: dist/Madeira.ipa
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print compiler errors
        if: failure()
        run: |
          for f in build/*/obj/*.err build/*/obj/err-*.txt; do
            [ -s "$f" ] || continue
            echo "::group::$f"; head -n 40 "$f"; echo "::endgroup::"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/*/obj/*.err
            build/*/obj/err-*.txt
            wine/build-macos/config.log
          if-no-files-found: ignore
