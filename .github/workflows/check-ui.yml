name: Check iOS UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Typecheck all app Swift for iOS 16.4
        run: |
          set -euo pipefail
          xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios16.4 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -import-objc-header app/Madeira/Madeira-Bridging-Header.h app/Madeira/*.swift
      - name: Test library behavior
        run: |
          set -euo pipefail
          xcrun swiftc app/Madeira/GameLibrary.swift tests/library_smoke.swift -o "$RUNNER_TEMP/library-tests"
          "$RUNNER_TEMP/library-tests"
      - name: Build library simulator preview
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/LibraryPreview.app" screenshots
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-ios16.4-simulator" \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            app/Madeira/GameLibrary.swift app/Madeira/LibraryView.swift tests/ui-preview/PreviewApp.swift \
            -o "$RUNNER_TEMP/LibraryPreview.app/LibraryPreview"
          cp tests/ui-preview/Info.plist "$RUNNER_TEMP/LibraryPreview.app/Info.plist"
          codesign --force --sign - "$RUNNER_TEMP/LibraryPreview.app"
      - name: Capture iPad and iPhone library
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          for family in iPad iPhone; do
            DEVICE=$(python3 -c 'import json,sys; devices=json.load(open(sys.argv[1]))["devices"]; print(next(d["udid"] for group in devices.values() for d in group if sys.argv[2] in d["name"] and d["isAvailable"]))' "$RUNNER_TEMP/devices.json" "$family")
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
            xcrun simctl install "$DEVICE" "$RUNNER_TEMP/LibraryPreview.app"
            xcrun simctl launch "$DEVICE" com.madeira.librarypreview
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "screenshots/$family-library.png"
            xcrun simctl terminate "$DEVICE" com.madeira.librarypreview
            xcrun simctl launch "$DEVICE" com.madeira.librarypreview --settings
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "screenshots/$family-settings.png"
            xcrun simctl shutdown "$DEVICE"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
