name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check out Madeira and all submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euxo pipefail
          ls -d /Applications/Xcode*.app
          XCODE_PATH="$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          else
            sudo xcode-select --switch \
              "$(ls -d /Applications/Xcode_1*.app | sort -V | tail -n 1)/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and package unsigned IPA
        run: bash scripts/ci-build-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: build/Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
